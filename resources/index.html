<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app">

    <!-- Left column: clock (top) + current conditions (bottom) -->
    <div id="col-clock-weather">

      <section id="panel-clock">
        <div id="clock-time">
          <span id="clock-hours">--</span><span class="clock-colon">:</span><span id="clock-minutes">--</span>
        </div>
        <div id="clock-seconds-ampm">
          <span id="clock-ampm"></span>
        </div>
        <hr class="panel-divider">
        <div id="clock-dayofweek"></div>
        <div id="clock-date"></div>
      </section>

      <section id="panel-current">
        <div id="weather-loading" class="loading-ring" aria-hidden="true"></div>
        <div id="weather-location">--</div>

        <div id="current-main">
          <div id="weather-icon-wrap">
            <img id="weather-icon" src="" alt="weather condition" width="72" height="72">
          </div>
          <div id="current-temp-block">
            <div id="weather-temp-wrap">
              <span id="weather-temp">--</span><span id="weather-unit" class="unit-toggle" title="Click to toggle units">°F</span>
            </div>
            <div id="weather-condition">--</div>
            <div id="weather-feels-like">Feels like --</div>
          </div>
        </div>

        <div id="current-details">
          <div id="weather-wind">-- --</div>
          <div id="weather-humidity">-- %</div>
          <div id="weather-sun">
            <span id="weather-sunrise">↑ --:--</span>
            <span id="weather-sunset">↓ --:--</span>
          </div>
        </div>
        <div id="weather-updated" class="stale-label"></div>
      </section>

    </div><!-- /col-clock-weather -->

    <!-- Middle column: Map & Radar -->
    <section id="panel-map" class="panel">
      <div id="map"></div>
      <div id="radar-timestamp"></div>
    </section>

    <!-- Right column: vertical 5-day forecast -->
    <section id="panel-forecast">
      <div id="forecast-rows"></div>
    </section>

  </div>

  <!-- Set Location modal -->
  <div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9000;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:10px;padding:24px 28px;width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.25);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;">
      <h3 style="margin:0 0 16px;font-size:15px;color:#1a2030;">Set Home Location</h3>
      <label style="display:block;margin-bottom:12px;">
        <span style="display:block;font-size:11px;font-weight:600;color:#6b7694;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px;">Latitude</span>
        <input id="modal-lat" type="number" step="0.0001" placeholder="e.g. 39.0997"
          style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #c8cdd8;border-radius:6px;font-size:14px;color:#1a2030;outline:none;">
      </label>
      <label style="display:block;margin-bottom:20px;">
        <span style="display:block;font-size:11px;font-weight:600;color:#6b7694;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px;">Longitude</span>
        <input id="modal-lon" type="number" step="0.0001" placeholder="e.g. -94.5786"
          style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #c8cdd8;border-radius:6px;font-size:14px;color:#1a2030;outline:none;">
      </label>
      <div id="modal-error" style="display:none;margin-bottom:12px;font-size:11px;color:#c0392b;"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="modal-cancel"
          style="padding:7px 16px;border:1px solid #c8cdd8;border-radius:6px;background:#f0f2f5;font-size:13px;cursor:pointer;color:#2c3550;">
          Cancel
        </button>
        <button id="modal-save"
          style="padding:7px 16px;border:none;border-radius:6px;background:#3b82d4;font-size:13px;cursor:pointer;color:#fff;font-weight:600;">
          Save &amp; Apply
        </button>
      </div>
    </div>
  </div>

  <!-- Vendor -->
  <script src="vendor/neutralino.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>

  <!-- App scripts -->
  <script src="scripts/config.js"></script>
  <script src="scripts/clock.js"></script>
  <script src="scripts/weather.js"></script>
  <script src="scripts/map.js"></script>
  <script>
    (async () => {
      if (typeof Neutralino !== 'undefined') {
        Neutralino.init();

        // Exit cleanly when the OS window close button is pressed
        Neutralino.events.on('windowClose', () => {
          Neutralino.app.exit();
        });

        // Set native menu bar
        Neutralino.events.on('ready', async () => {
          try {
            await Neutralino.window.setMainMenu([
              {
                id: 'file',
                text: 'File',
                menuItems: [
                  { id: 'quit', text: 'Quit', shortcut: 'Ctrl+Q' }
                ]
              },
              {
                id: 'settings',
                text: 'Settings',
                menuItems: [
                  { id: 'set-location', text: 'Set Location…' }
                ]
              }
            ]);
            Neutralino.events.on('menuItemClicked', (e) => {
              if (e.detail.id === 'quit') Neutralino.app.exit();
              if (e.detail.id === 'set-location') openLocationModal();
            });
          } catch (_) {
            // setMainMenu not supported on this platform — no-op
          }
        });
      }
      await initConfig();
      initClock();
      initWeather();
      initMap();

      // ── Location modal ──────────────────────────────────────────────────
      function openLocationModal() {
        const overlay = document.getElementById('modal-overlay');
        const latInput = document.getElementById('modal-lat');
        const lonInput = document.getElementById('modal-lon');
        const errEl    = document.getElementById('modal-error');

        // Pre-fill with current configured values (not GPS-resolved)
        latInput.value = AppConfig.latitude  ?? '';
        lonInput.value = AppConfig.longitude ?? '';
        errEl.style.display = 'none';
        overlay.style.display = 'flex';
        latInput.focus();
      }

      function closeLocationModal() {
        document.getElementById('modal-overlay').style.display = 'none';
      }

      document.getElementById('modal-cancel').addEventListener('click', closeLocationModal);

      document.getElementById('modal-overlay').addEventListener('click', (e) => {
        if (e.target === document.getElementById('modal-overlay')) closeLocationModal();
      });

      document.getElementById('modal-save').addEventListener('click', async () => {
        const lat = parseFloat(document.getElementById('modal-lat').value);
        const lon = parseFloat(document.getElementById('modal-lon').value);
        const errEl = document.getElementById('modal-error');

        if (isNaN(lat) || lat < -90  || lat > 90) {
          errEl.textContent = 'Latitude must be between -90 and 90.';
          errEl.style.display = 'block';
          return;
        }
        if (isNaN(lon) || lon < -180 || lon > 180) {
          errEl.textContent = 'Longitude must be between -180 and 180.';
          errEl.style.display = 'block';
          return;
        }

        closeLocationModal();

        // Save to override file and apply live
        await saveOverrideConfig({ latitude: lat, longitude: lon, useGeolocation: false });
        AppConfig.locationSource = 'config';

        // Trigger weather + map refresh at the new location
        document.dispatchEvent(new CustomEvent('locationPinned', {
          detail: { lat, lon }
        }));
      });
    })();
  </script>
</body>
</html>
